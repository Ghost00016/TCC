<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Pessoa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<button class="btn-voltar" onclick="voltar()">← Voltar</button>

<h1>Controle de Pessoa</h1>
<p>Gerencie as pessoas cadastradas no sistema.</p>

<div id="mensagem"></div>

<div class="botoes">
    <button class="btn-cadastro" onclick="registrarPessoa()">Registrar Pessoa</button>
</div>

<div class="lista">
    <h2>Pessoas cadastradas</h2>
    <div id="pessoas"><p>Carregando pessoas...</p></div>
</div>

<div id="formulario" class="formulario">

    <h2>Alterar Pessoa</h2>

    <form id="formAlterar">

        <input type="hidden" id="id">

        <label for="nome">Nome</label>
        <input type="text" id="nome" required>

        <label for="idade">Idade</label>
        <input type="number" id="idade" min="1" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" maxlength="14" required>

        <label for="sexo">Sexo</label>
        <select id="sexo" required>
            <option value="">Selecione</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
            <option value="Outro">Outro</option>
        </select>

        <label for="cargo">Cargo</label>
        <input type="text" id="cargo" required>

        <label>Locais de acesso</label>

        <div id="locais" class="locais">
            <p>Carregando locais...</p>
        </div>

        <div class="botoes-formulario">
            <button type="submit" class="btn-salvar">Salvar Alterações</button>
            <button type="button" class="btn-cancelar" onclick="cancelarAlteracao()">Cancelar</button>
        </div>

    </form>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
