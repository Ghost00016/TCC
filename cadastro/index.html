<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cadastro">
    <button class="btn-voltar" onclick="voltarInicial()">
        ← Voltar
    </button>

    <h1>Cadastro</h1>
    <p>Cadastre uma nova pessoa</p>

    <form id="formulario">
        <label>Nome</label>
        <input type="text" id="nome" placeholder="Digite o nome" required>

        <label>Idade</label>
        <input type="number" id="idade" placeholder="Digite a idade" min="1" required>

        <label>CPF</label>
        <input type="text" id="cpf" placeholder="Digite o CPF" maxlength="14" required>

        <label>Sexo</label>
        <select id="sexo" required>
            <option value="">Selecione</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
            <option value="Outro">Outro</option>
        </select>

        <label>Cargo</label>
        <input type="text" id="cargo" placeholder="Digite o cargo" required>

        <label>Locais de acesso</label>

        <div id="locais" class="locais">
            <p>Carregando locais...</p>
        </div>

        <button type="submit" class="btn-continuar">
            Continuar
        </button>
    </form>

    <div id="mensagem"></div>
</div>

<script src="script.js"></script>
</body>
</html>
